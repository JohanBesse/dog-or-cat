<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photo credits — Dog or Cat?</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.svg">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="page">
<main class="prose">
  <h1>Photo credits</h1>
  <p>Every photograph in <a href="/">Dog or Cat?</a> comes from Wikimedia
  Commons and is used under the licence shown beside it. The photographs are
  the work of their photographers, not of this site.</p>

  <p id="intro" class="muted-line">Loading…</p>
  <ul class="credits" id="recent"></ul>

  <p>
    <button class="next-button" id="show-all">Show credits for every photograph</button>
    <span class="muted-line">— this names all 59 animals, so it gives the game away.</span>
  </p>
  <ul class="credits" id="all" hidden></ul>

  <p class="back"><a href="/">Back to the game</a></p>
</main>

<script type="module">
// Only the photographs you have actually been shown are listed by default.
// The full list names every animal in the game, which is a spoiler, so it
// stays behind a deliberate click.
const LAST_GAME = 'dogorcat:last-game';

const data = await fetch('data/species.json').then(r => r.json());
const byId = new Map(data.species.map(s => [s.id, s]));

function row(species) {
  const li = document.createElement('li');
  const img = document.createElement('img');
  img.src = species.photo.thumb;
  img.width = species.photo.thumb_width;
  img.height = species.photo.thumb_height;
  img.alt = '';
  img.loading = 'lazy';

  const text = document.createElement('div');
  const name = document.createElement('b');
  name.textContent = species.name;
  text.append(name, document.createElement('br'),
              document.createTextNode(`Photo by ${species.credit.artist || 'an unnamed contributor'} · `));

  if (species.credit.license_url) {
    const licence = document.createElement('a');
    licence.href = species.credit.license_url;
    licence.rel = 'license';
    licence.textContent = species.credit.license;
    text.append(licence);
  } else {
    text.append(document.createTextNode(species.credit.license));
  }

  const source = document.createElement('a');
  source.href = species.credit.file_page;
  source.textContent = 'Wikimedia Commons';
  text.append(document.createTextNode(' · '), source);

  li.append(img, text);
  return li;
}

let played = [];
try {
  played = JSON.parse(localStorage.getItem(LAST_GAME) || '[]');
} catch (err) { played = []; }

const shown = played.map(id => byId.get(id)).filter(Boolean);
const intro = document.getElementById('intro');
if (shown.length) {
  intro.textContent = `The ${shown.length} photographs from your last game:`;
  document.getElementById('recent').append(...shown.map(row));
} else {
  intro.textContent = 'Play a game and the photographs you were shown will be '
    + 'credited here. Listing them before you have seen them would give the '
    + 'answers away.';
}

document.getElementById('show-all').addEventListener('click', event => {
  const list = document.getElementById('all');
  list.replaceChildren(...data.species.map(row));
  list.hidden = false;
  event.target.remove();
});
</script>
</body>
</html>
